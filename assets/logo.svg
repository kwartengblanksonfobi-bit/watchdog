<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="burgundyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B1E3F" />
      <stop offset="50%" stop-color="#6B1724" />
      <stop offset="100%" stop-color="#4A0E17" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9D423" />
      <stop offset="100%" stop-color="#E1A100" />
    </linearGradient>
    <linearGradient id="accentWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F2E6E6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#4A0E17" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Shield Outer -->
  <path d="M250 35 L420 105 C420 280 340 395 250 465 C160 395 80 280 80 105 Z" 
        fill="url(#burgundyGrad)" 
        stroke="url(#goldGrad)" 
        stroke-width="8" 
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Inner Shield Border -->
  <path d="M250 60 L395 120 C395 265 325 365 250 430 C175 365 105 265 105 120 Z" 
        fill="none" 
        stroke="#FFFFFF" 
        stroke-opacity="0.25" 
        stroke-width="3" 
        stroke-dasharray="8 6"/>

  <!-- Watchdog Silhouette / Modern Geometric Dog & Speed Wings -->
  <!-- Dog Head (Profile - Alert & Dynamic) -->
  <path d="M230 140 
           L290 140 
           L335 185 
           L320 230 
           L345 245 
           L330 280 
           L290 270 
           L270 310 
           L220 310 
           L205 250 
           L220 215 
           L210 180 Z" 
        fill="url(#accentWhite)" />

  <!-- Dog Ear (Pricked/Alert) -->
  <path d="M230 140 L265 95 L275 140 Z" fill="url(#accentWhite)"/>
  <path d="M242 135 L263 105 L268 135 Z" fill="#6B1724"/>

  <!-- Collar & Dog Tag (Gold) -->
  <path d="M215 285 L280 285 L275 305 L220 305 Z" fill="url(#goldGrad)" />
  <circle cx="247" cy="325" r="14" fill="url(#goldGrad)" stroke="#6B1724" stroke-width="3"/>
  <circle cx="247" cy="325" r="5" fill="#6B1724"/>

  <!-- Dynamic Speed Delivery Wings / Fast Dispatch Lines -->
  <path d="M135 200 L185 200 L170 220 L120 220 Z" fill="url(#goldGrad)" opacity="0.95"/>
  <path d="M120 235 L175 235 L160 255 L105 255 Z" fill="url(#goldGrad)" opacity="0.8"/>
  <path d="M140 270 L185 270 L170 290 L125 290 Z" fill="url(#goldGrad)" opacity="0.6"/>

  <!-- Dog Eye & Snout detail -->
  <circle cx="295" cy="195" r="7" fill="#4A0E17"/>
  <polygon points="340,240 348,245 338,252" fill="#4A0E17"/>

  <!-- Subtle lightning bolt / dispatch emblem on shield base -->
  <polygon points="250,355 262,380 248,380 255,405 238,375 250,375" fill="url(#goldGrad)"/>
</svg>
